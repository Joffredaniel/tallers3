<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tabla de Personas</title>
  <link rel="stylesheet" href="personas.css">
  <script src="https://kit.fontawesome.com/e68fc070ec.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="contenedor">
    <h1>Lista de Personas</h1>
    <table id="tablaPersonas">
      <thead>
        <tr>
          <th>Cédula</th><th>Nombre</th><th>Apellido</th><th>Fecha</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>0101010101</td><td>Juan</td><td>Pérez</td><td>1990-04-15</td>
          <td class="acciones"><i class="fas fa-eye icono ver" onclick="verPersona(this)"></i>
          <i class="fas fa-trash icono eliminar" onclick="eliminarFila(this)"></i></td></tr>
      </tbody>
    </table>
  </div>
  <script src="personas.js"></script>
</body>
</html>
